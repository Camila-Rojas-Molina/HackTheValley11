[pytest]
pythonpath = .
testpaths = tests
addopts = --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Most markers are applied by tests/conftest.py (pytest_collection_modifyitems), from the file and the
# fixtures a test uses; scripts/test_all.sh runs one suite per marker. Fast suite: -m "not slow".
markers =
    unit: no database and no server process
    db: needs a PostgreSQL server (pgserver by default, or RB_TEST_PG_URI)
    tsdb: needs a TimescaleDB server (RB_TEST_TSDB_URI, or this worktree's rb-tsdb-<hash> Docker container)
    contract: API contract tests for every route
    wiring: starts the real app (scripts/run.py) and follows every path through it
    e2e: end to end through a running server
    browser: drives Google Chrome
    docker: needs Docker
    slow: starts a server process or a browser, or needs Docker
    chaos: starts a real server process and kills it with SIGKILL (or cuts its database)
    ops: runs scripts against a real server process (minutes)
