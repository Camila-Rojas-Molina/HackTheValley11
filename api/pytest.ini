[pytest]
pythonpath = .
testpaths = tests
addopts = --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Most markers are applied by tests/conftest.py (pytest_collection_modifyitems), from the file and the
# fixtures a test uses; scripts/test_all.sh runs one suite per marker. Fast suite: -m "not slow".
markers =
    unit: no database and no server process
    db: needs a PostgreSQL server (pgserver by default, or STILLHERE_TEST_PG_URI)
    property: Hypothesis property-based tests of the KAZE invariants
    contract: API contract tests for every route
    security: regression tests pinned to a review finding (tests/security_findings.py)
    wording: the banned-wording lint (BUILD_PLAN 7.3)
    load: concurrency and load test
    wiring: starts the real app (scripts/run.py) and follows every path through it
    e2e: scripts/simulate.py end to end, all seven KAZE scenarios plus the PCC seed
    browser: drives Google Chrome (Playwright, or the DevTools protocol)
    docker: needs TimescaleDB servers (STILLHERE_TSDB_URIS), e.g. the container scripts/test_all.sh starts
    slow: starts a server process or a browser, or needs Docker
    chaos: starts a real server process and kills it with SIGKILL (or cuts its database)
    ops: runs scripts/*.py or a browser against a real server process (minutes)
