<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f5f6f8" id="theme-color">
<title>StillHere contact</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --text: #14161a; --muted: #5b616b; --border: #e2e5e9;
    --accent: #1d4ed8; --accent-text: #ffffff; --secondary: #4b5563;
    --alarm: #c1121f; --alarm-deep: #8a0a14; --on-alarm: #ffffff;
    --notice: #9a4b00; --notice-bg: #fff3e0; --ok: #15803d; --focus: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1114; --surface: #1a1d22; --text: #eef0f3; --muted: #a3a9b3; --border: #2c3138;
      --accent: #3b82f6; --secondary: #6b7280; --notice: #ffb35c; --notice-bg: #2a2015; --ok: #4ade80;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1114; --surface: #1a1d22; --text: #eef0f3; --muted: #a3a9b3; --border: #2c3138;
    --accent: #3b82f6; --secondary: #6b7280; --notice: #ffb35c; --notice-bg: #2a2015; --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 34rem; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 32px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 14px;
         font-size: .85rem; color: var(--muted); }
  .brand { font-weight: 700; letter-spacing: .02em; }
  .conn { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .conn.down .dot { background: var(--notice); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px 20px; }
  h1 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 10px; }
  p { margin: 10px 0; }
  .lead { font-size: 1.1rem; }
  .muted { color: var(--muted); }
  .fine { color: var(--muted); font-size: .92rem; padding-left: 1.1em; margin: 16px 0 0; }
  .fine li { margin: 6px 0; }
  label { display: block; margin: 16px 0 0; font-weight: 600; }
  label span { font-weight: 400; color: var(--muted); }
  input[type=text] { display: block; width: 100%; margin-top: 6px; padding: 12px 14px; font-size: 1.05rem;
                     border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); }
  button { display: block; width: 100%; min-height: 56px; margin: 12px 0 0; padding: 14px 16px;
           font: inherit; font-size: 1.1rem; font-weight: 650; border: 0; border-radius: 12px;
           background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button.secondary { background: var(--secondary); color: #fff; }
  button.ghost { background: transparent; color: inherit; border: 2px solid currentColor; }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
          background: var(--bg); border: 1px solid var(--border); font-size: .9rem; margin-top: 14px; }
  .notice { background: var(--notice-bg); border-color: transparent; }
  .notice h1 { color: var(--notice); }
  .toast { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,.08); font-weight: 600; }
  .toast:empty { display: none; }
  a { color: inherit; }

  /* Alert: the whole screen turns red. */
  body.alarm { background: var(--alarm); color: var(--on-alarm); }
  body.alarm .top { color: rgba(255,255,255,.85); }
  body.alarm .card { background: transparent; border: 0; padding: 4px 0; }
  body.alarm h1 { font-size: 1.75rem; }
  body.alarm button { background: #ffffff; color: var(--alarm-deep); }
  body.alarm button.secondary { background: rgba(0,0,0,.28); color: #fff; }
  body.alarm .toast { background: rgba(0,0,0,.25); }
  body.alarm.pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { background: var(--alarm); } 50% { background: var(--alarm-deep); } }
  @media (prefers-reduced-motion: reduce) { body.alarm.pulse { animation: none; } }
  .kicker { font-size: .85rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
  .banner { margin: 16px 0 4px; padding: 14px; border-radius: 12px; background: #000; color: #fff;
            font-weight: 750; border: 2px solid #fff; }
  .loc { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: rgba(0,0,0,.2); }
  .handled { margin-top: 12px; font-weight: 650; }
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="brand">StillHere</span>
    <span class="conn" id="conn" hidden><span class="dot" aria-hidden="true"></span><span id="conn-text">Live</span></span>
  </div>
  <div class="card" id="view" aria-live="polite"><p class="muted">Loading…</p></div>
  <div class="toast" id="toast" role="status"></div>
</main>
<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------- storage
  function sget(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function sset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var urlToken = decodeURIComponent(location.pathname.split("/").pop() || "");
  var inviteKey = "sh_contact_" + urlToken;
  var contactToken = sget(inviteKey);
  var wearer = null;
  var view = document.getElementById("view");
  var toastEl = document.getElementById("toast");
  var conn = document.getElementById("conn");
  var connText = document.getElementById("conn-text");
  var themeColor = document.getElementById("theme-color");

  function api(token, path) { return "/v1/contact/" + encodeURIComponent(token) + path; }

  // ---------------------------------------------------------------- tiny DOM helper
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "onclick") el.onclick = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null) el.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return el;
  }
  function render(nodes, mode) {
    document.body.classList.toggle("alarm", mode === "alarm" || mode === "alarm-quiet");
    document.body.classList.toggle("pulse", mode === "alarm");
    view.classList.toggle("notice", mode === "notice");
    themeColor.setAttribute("content", mode === "alarm" || mode === "alarm-quiet" ? "#c1121f" : "#f5f6f8");
    document.title = mode === "alarm" || mode === "alarm-quiet" ? "ALERT – StillHere" : "StillHere contact";
    view.textContent = "";
    nodes.forEach(function (n) { if (n) view.appendChild(n); });
  }
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg || "";
    clearTimeout(toastTimer);
    if (msg) toastTimer = setTimeout(function () { toastEl.textContent = ""; }, 6000);
  }
  function setConn(up) {
    conn.hidden = false;
    conn.classList.toggle("down", !up);
    connText.textContent = up ? "Live" : "Reconnecting…";
  }

  // ---------------------------------------------------------------- alarm
  // A looping <audio> element is started muted inside the consent tap (that tap
  // is what lets it play later); an alert unmutes it, so the phone rings. Audio
  // elements ignore the iOS ring/silent switch; Web Audio follows it, so the
  // AudioContext is only a fallback.
  var Alarm = (function () {
    var audio = null, actx = null, osc = null, oscTimer = null, vibTimer = null;
    var unlocked = false, ringing = false, wakeLock = null, listeners = [];

    function wavUrl() {
      var rate = 8000, n = rate, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf), i, phase = 0;
      function str(o, s) { for (var j = 0; j < s.length; j++) v.setUint8(o + j, s.charCodeAt(j)); }
      str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE"); str(12, "fmt ");
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      str(36, "data"); v.setUint32(40, n * 2, true);
      for (i = 0; i < n; i++) {
        var f = (Math.floor(i / (rate / 4)) % 2) ? 660 : 960;   // two tones, four changes a second
        phase += 2 * Math.PI * f / rate;
        var s = Math.sin(phase) >= 0 ? 0.55 : -0.55;              // square-ish: loud on small speakers
        v.setInt16(44 + i * 2, Math.round(s * 32767), true);
      }
      return URL.createObjectURL(new Blob([buf], {type: "audio/wav"}));
    }
    function notify() { listeners.forEach(function (fn) { try { fn(); } catch (e) {} }); }
    function requestWakeLock() {
      if (!("wakeLock" in navigator) || wakeLock) return;
      navigator.wakeLock.request("screen").then(function (l) {
        wakeLock = l;
        l.addEventListener("release", function () { wakeLock = null; });
      }, function () {});
    }
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && unlocked) requestWakeLock();
    });
    function startOsc() {
      if (!actx || osc) return;
      try {
        var g = actx.createGain(); g.gain.value = 0.4; g.connect(actx.destination);
        osc = actx.createOscillator(); osc.type = "square"; osc.frequency.value = 960; osc.connect(g); osc.start();
        oscTimer = setInterval(function () { if (osc) osc.frequency.value = osc.frequency.value > 800 ? 660 : 960; }, 250);
      } catch (e) { osc = null; }
    }
    function stopOsc() {
      clearInterval(oscTimer); oscTimer = null;
      if (osc) { try { osc.stop(); } catch (e) {} osc = null; }
    }
    function unlock() {   // call from a tap
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
      if (!audio) {
        audio = new Audio();
        audio.src = wavUrl();
        audio.loop = true;
        audio.preload = "auto";
        audio.setAttribute("playsinline", "");
      }
      audio.muted = !ringing;
      var p = audio.play();
      var ok = function () { unlocked = true; notify(); };
      if (p && p.then) p.then(ok, function () { notify(); }); else ok();
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { actx = actx || new AC(); if (actx.state === "suspended") actx.resume(); }
      } catch (e) {}
      requestWakeLock();
    }
    function ring(on) {
      on = !!on;
      if (on === ringing) return;
      ringing = on;
      if (audio) {
        audio.muted = !on;
        if (on) {
          try { audio.currentTime = 0; } catch (e) {}
          var p = audio.play();
          if (p && p.catch) p.catch(function () { startOsc(); });
        }
      } else if (on) {
        startOsc();
      }
      if (!on) stopOsc();
      clearInterval(vibTimer); vibTimer = null;
      if (on && navigator.vibrate) {
        var vib = function () { try { navigator.vibrate([500, 250, 500, 250, 500]); } catch (e) {} };
        vib(); vibTimer = setInterval(vib, 2500);
      }
    }
    return {
      unlock: unlock, ring: ring,
      isUnlocked: function () { return unlocked; },
      isRinging: function () { return ringing; },
      onChange: function (fn) { listeners.push(fn); }
    };
  })();

  function soundPill(onAlarm) {
    if (Alarm.isUnlocked()) {
      return h("div", {"class": "pill"}, [h("span", {"class": "dot", "aria-hidden": "true"}),
        "Alarm sound on · screen stays awake"]);
    }
    return h("button", {"class": onAlarm ? "ghost" : "secondary", onclick: function () { Alarm.unlock(); }},
      ["Turn on the alarm sound"]);
  }

  // ---------------------------------------------------------------- screens
  var lastSig = null;
  function screen(sig, nodes, mode) {
    if (sig === lastSig) return;
    lastSig = sig;
    render(nodes, mode);
  }
  Alarm.onChange(function () { lastSig = null; if (lastStatus) show(lastStatus); });

  function loading() { screen("loading", [h("p", {"class": "muted", text: "Loading…"})]); }

  function invalidInvite() {
    Alarm.ring(false);
    screen("invalid", [
      h("h1", {text: "This invite link has expired"}),
      h("p", {"class": "muted", text: "Invites work once and only for 10 minutes. Ask for a new one."})
    ]);
  }

  function gone() {
    Alarm.ring(false);
    stopPolling();
    screen("gone", [
      h("h1", {text: "This link is no longer active"}),
      h("p", {"class": "muted", text: "You're not on this person's trusted contact list any more."})
    ]);
  }

  function consent(info) {
    var who = info.wearer || "She";
    var n = info.n || 1;
    var nameInput = h("input", {type: "text", id: "name", maxlength: "60", autocomplete: "given-name",
                                placeholder: "e.g. Sam"});
    var btn = h("button", {id: "join"}, ["Ask to become Contact #" + n]);
    btn.onclick = function () { join(btn, nameInput.value, who); };
    screen("consent", [
      h("h1", {text: who + " invited you to be a trusted contact"}),
      h("p", {"class": "lead", text: "You'll see nothing unless " + who + " misses check-ins. " +
                                      "Tap to ask to become Contact #" + n + "."}),
      h("label", {"for": "name"}, ["Your name ", h("span", {text: "(so " + who + " knows who's asking)"}), nameInput]),
      btn,
      h("ul", {"class": "fine"}, [
        h("li", {text: who + " has to approve you. Contacts can't add themselves."}),
        h("li", {text: "If " + who + " misses check-ins or asks for help, this page turns red and this phone rings. " +
                       "Keep it open with the volume up."}),
        h("li", {text: "The tap also turns on the alarm sound and keeps the screen awake."})
      ])
    ]);
  }

  function join(btn, name, who) {
    Alarm.unlock();            // inside the tap: unlocks the looping alarm (muted until an alert)
    btn.disabled = true;
    fetch(api(urlToken, "/join"), {method: "POST", headers: {"Content-Type": "application/json"},
                                   body: JSON.stringify({name: (name || "").trim() || null})})
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { return [r.status, b]; }); })
      .then(function (res) {
        if (res[0] !== 200) { invalidInvite(); return; }
        contactToken = res[1].contact_token;
        wearer = who;
        sset(inviteKey, contactToken);
        sset("sh_wearer_" + contactToken, who);
        try { history.replaceState(null, "", "/c/" + encodeURIComponent(contactToken)); } catch (e) {}
        startPolling();
      })
      .catch(function () { btn.disabled = false; toast("Couldn't reach StillHere. Check your connection and try again."); });
  }

  function pending() {
    Alarm.ring(false);
    var who = wearer || "She";
    screen("pending:" + Alarm.isUnlocked(), [
      h("h1", {text: "Waiting for " + who + " to approve you"}),
      h("p", {text: who + " has to approve you before you become a trusted contact. Keep this page open."}),
      soundPill(false)
    ]);
  }

  function calm() {
    Alarm.ring(false);
    var who = wearer || "her";
    screen("calm:" + Alarm.isUnlocked(), [
      h("h1", {text: "You're " + (wearer ? wearer + "'s" : "a") + " trusted contact"}),
      h("p", {text: "You'll see nothing unless " + who + " misses check-ins or asks for help."}),
      h("p", {"class": "muted", text: "Keep this page open with the volume up. If an alert comes in, " +
                                      "the screen turns red and this phone rings."}),
      soundPill(false)
    ]);
  }

  // After "pass it on" / "can't reach her", the next level re-pings this contact
  // by design; stay quiet until the alert moves past that level or reaches FINAL.
  var quiet = null;
  function quieted(a) {
    return quiet && quiet.id === a.id && !a.final && a.level <= quiet.upto;
  }

  var LABELS = {ack: "I'm on it", pass: "Can't help – pass it on", safe: "I'm with her – she's safe",
                cant_reach: "Can't reach her"};
  var ANSWERS = {acked: "Thanks, you're on it.", already_handled: "Someone is already handling it.",
                 passed: "Passed on to the next contact.", resolved: "Thank you. Marked safe.",
                 escalated: "Alerting the next contact.", ignored: "This alert is no longer active."};

  function act(x, a, btn) {
    btn.disabled = true;
    var path = x === "ack" ? "/ack" : "/followup";
    fetch(api(contactToken, path), {method: "POST", headers: {"Content-Type": "application/json"},
                                    body: x === "ack" ? "{}" : JSON.stringify({action: x})})
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { return [r.status, b]; }); })
      .then(function (res) {
        if (res[0] === 200 && (x === "pass" || x === "cant_reach") && res[1].ok) quiet = {id: a.id, upto: a.level + 1};
        toast(res[0] === 200 ? (ANSWERS[res[1].result] || "") : ANSWERS.ignored);
        lastSig = null;
        poll();
      })
      .catch(function () { btn.disabled = false; toast("Couldn't reach StillHere. Try again."); });
  }

  var locCache = {};
  function locationBlock(a) {
    var loc = a.location;
    if (!loc) return h("div", {"class": "loc", text: "Last known location: not available."});
    var label = "Last known location" + (loc.simulated ? " (simulated)" : "") + " · as of " + loc.as_of +
                " · " + loc.age_min + " min old";
    var path;
    try { path = new URL(loc.link, location.href).pathname; } catch (e) { path = null; }
    var slot = h("span", {}, []);
    var c = path && locCache[path];
    if (c === "gone") slot.appendChild(document.createTextNode(" · link expired"));
    else if (c) slot.appendChild(h("a", {href: c, target: "_blank", rel: "noreferrer noopener"}, [" · Open map"]));
    else if (path && c === undefined) {
      locCache[path] = null;
      fetch(path, {cache: "no-store"}).then(function (r) {
        if (r.status === 410) { locCache[path] = "gone"; return null; }
        return r.ok ? r.json() : null;
      }).then(function (b) { if (b && b.map) locCache[path] = b.map; lastSig = null; if (lastStatus) show(lastStatus); })
        .catch(function () { delete locCache[path]; });
    }
    return h("div", {"class": "loc"}, [label, slot]);
  }

  function alertView(a) {
    var who = wearer || a.wearer || "She";
    var opened = "";
    try { opened = new Date(a.opened_at).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}); } catch (e) {}
    if (a.kind === "LOST_CONTACT") {
      Alarm.ring(false);
      screen("lost:" + a.id + ":" + JSON.stringify(locCache), [
        h("p", {"class": "kicker", text: "Notice"}),
        h("h1", {text: a.title}),
        h("p", {text: "No action needed yet. If she then misses a check-in, this page turns red and this phone rings."})
      ], "notice");
      return;
    }
    var someoneElse = a.status === "ACKED" && !a.you_acked;
    var shouldRing = a.actions.indexOf("ack") >= 0 && !quieted(a);
    Alarm.ring(shouldRing);
    var nodes = [
      h("p", {"class": "kicker", text: a.final ? "Final step" : (a.kind === "DURESS" ? "Silent help request" : "Alert")}),
      h("h1", {text: a.title}),
      opened ? h("p", {text: "Since " + opened + "."}) : null
    ];
    if (a.handled_by && !a.you_acked) nodes.push(h("p", {"class": "handled", text: a.handled_by + " is handling it."}));
    if (a.you_acked) nodes.push(h("p", {"class": "handled",
      text: "You're handling it. Tap below once you're with " + (who === "She" ? "her" : who) + ", or if you can't reach her."}));
    if (a.banner) nodes.push(h("div", {"class": "banner", role: "alert", text: a.banner}));
    nodes.push(locationBlock(a));
    a.actions.forEach(function (x) {
      var b = h("button", {"class": (x === "pass" || x === "cant_reach") ? "secondary" : null,
                           "data-x": x}, [LABELS[x] || x]);
      b.onclick = function () { act(x, a, b); };
      nodes.push(b);
    });
    if (!Alarm.isUnlocked() && shouldRing) nodes.push(soundPill(true));
    var sig = ["alert", a.id, a.kind, a.level, a.final, a.status, a.handled_by, a.you_acked, a.actions.join(","),
               shouldRing, Alarm.isUnlocked(), JSON.stringify(locCache)].join("|");
    screen(sig, nodes, someoneElse || !shouldRing ? "alarm-quiet" : "alarm");
  }

  var lastStatus = null;
  function show(s) {
    lastStatus = s;
    if (!s.alert) { quiet = null; if (s.approved) calm(); else pending(); return; }
    alertView(s.alert);
  }

  // ---------------------------------------------------------------- polling (every second)
  var pollTimer = null, failures = 0, polling = false;
  function stopPolling() { polling = false; clearTimeout(pollTimer); }
  function schedule() { if (polling) { clearTimeout(pollTimer); pollTimer = setTimeout(poll, 1000); } }
  function poll() {
    if (!contactToken) return;
    clearTimeout(pollTimer);
    fetch(api(contactToken, "/status"), {cache: "no-store"})
      .then(function (r) {
        if (r.status === 404) { gone(); return null; }
        if (!r.ok) throw new Error(String(r.status));
        return r.json();
      })
      .then(function (s) { if (s) { failures = 0; setConn(true); show(s); schedule(); } })
      .catch(function () {
        // Keep showing (and sounding) the last state while the server is unreachable.
        failures += 1;
        if (failures >= 3) setConn(false);
        schedule();
      });
  }
  function startPolling() { polling = true; poll(); }

  // ---------------------------------------------------------------- start
  function start() {
    loading();
    if (contactToken) { wearer = sget("sh_wearer_" + contactToken); startPolling(); return; }
    // A live-page link (e.g. from Telegram) is already a contact token.
    fetch(api(urlToken, "/status"), {cache: "no-store"}).then(function (r) {
      if (r.status === 200) {
        contactToken = urlToken;
        wearer = sget("sh_wearer_" + contactToken);
        startPolling();
        return;
      }
      return fetch(api(urlToken, "/invite"), {cache: "no-store"}).then(function (r2) {
        if (r2.status !== 200) { invalidInvite(); return; }
        return r2.json().then(consent);
      });
    }).catch(function () {
      toast("Couldn't reach StillHere. Retrying…");
      setTimeout(start, 2000);
    });
  }
  start();
})();
</script>
</body>
</html>
