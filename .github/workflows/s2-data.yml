# S2 (data and Bone Finder): the suites registered in suites/s2.toml, each run with the exact command written there.
# M3 is curation only: the job checks the committed demo/ bundle. No secrets, no network beyond the checkout,
# and no RB_DATA_DIR on the runner, so the checks against the large source files skip with their reason.
name: s2-data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-repo.txt
      - name: Install (.venv, pytest pinned in scripts/requirements-repo.txt)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r scripts/requirements-repo.txt
      - name: pipeline (demo bundle)
        run: bash -c "$(.venv/bin/python -c 'import tomllib; print(tomllib.load(open("suites/s2.toml", "rb"))["suites"]["pipeline"]["run"])')"
