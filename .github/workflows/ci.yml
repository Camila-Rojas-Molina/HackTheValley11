# Unit, property, contract and plain-PostgreSQL integration tests, plus the migration test on TimescaleDB.
# No secrets: the databases are throwaway service containers with trust auth, and the app runs without
# Telegram, Tiger Cloud or Vultr keys. The live-server, browser, chaos and Docker suites run locally with
# backend/scripts/test_all.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      STILLHERE_TEST_PG_URI: postgresql://postgres@127.0.0.1:5432/postgres
      TELEGRAM_BOT_TOKEN: ""
      VULTR_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tests/test_security_regressions.py checks every fix commit is in the history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Unit tests (state machine, rules, parsers, care rules, wording)
        run: python -m pytest -q -m "unit and not property"
      - name: Property tests (Hypothesis)
        run: python -m pytest -q -m property
      - name: API contract tests
        run: python -m pytest -q -m contract
      - name: Integration tests on plain PostgreSQL
        run: python -m pytest -q -m "db and not slow and not property and not contract"
      - name: Migration test on TimescaleDB
        env:
          STILLHERE_TSDB_URIS: postgresql://postgres@127.0.0.1:5433/postgres
        run: python -m pytest -q tests/test_migrations_db.py -m docker -rs
