# S4 (API, jobs, Tiger) suites. Format: scripts/test_all.py. Commands run from the repo root.
# api/tests/ai/** belongs to S5 (suites/s5.toml), so every S4 command leaves it out.
# Database tests use pgserver with PGDATA in <worktree>/.pgdata/ and the database rb_test_<worktree hash>,
# or the server in RB_TEST_PG_URI (CI: a postgres:16 service container).
stream = "S4"

[suites.unit]
what = "API without a database: import cuts, per-worktree test names"
run = ".venv/bin/python -m pytest -q -p no:cacheprovider api/tests --ignore=api/tests/ai -m 'unit and not contract'"
timeout = 600

[suites.contract]
what = "C1 on the real app: every mounted route, fixtures verbatim, 501 bodies, 404s, health 200/503, openapi.json snapshot"
run = ".venv/bin/python -m pytest -q -p no:cacheprovider api/tests --ignore=api/tests/ai -m contract"
timeout = 900

[suites.db]
what = "API on Postgres: the session database is this worktree's rb_test_<hash>"
run = ".venv/bin/python -m pytest -q -p no:cacheprovider api/tests --ignore=api/tests/ai -m 'db and not contract'"
timeout = 900
